name: Python

on:
  push:
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-lock.txt

      # GitHub runners have no GPU, so CI uses the CPU build of the same torch version.
      - name: Install dependencies
        run: |
          pip install torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-lock.txt
          pip install -e . --no-deps

      - name: Cache Franka Panda model
        uses: actions/cache@v6
        with:
          path: src/gesture_bc/sim/assets/franka_emika_panda
          key: menagerie-panda-${{ hashFiles('scripts/fetch_assets.py') }}

      - name: Download Franka Panda model
        run: python scripts/fetch_assets.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Lint (ruff)
        run: |
          ruff check .
          ruff format --check .

      - name: Tests (pytest, no GUI)
        run: pytest -m "not gui"
